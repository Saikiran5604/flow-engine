# ===========================================================================
# Hasura table metadata — relationships + permissions.
#
# Permission model (this is Layer 1, enforced at the data boundary):
#   * The `user` role gets SELECT ONLY, and every table's row filter walks the
#     org_members relation back to the caller's JWT claim X-Hasura-User-Id.
#     A user therefore can only ever read rows belonging to an org they are a
#     member of — cross-org reads (including via guessed IDs and via GraphQL
#     subscriptions) return zero rows.
#   * There are deliberately NO insert/update/delete permissions for `user`.
#     All writes go through the Action handler serverless functions
#     (nhost/functions), which run with the admin secret and enforce Layer 1
#     (org scoping) AND Layer 2 (owner-only step types + mid-run approval role).
#     This keeps privileged mutations impossible to forge from the client.
#   * The webhook `token` column is excluded from the `user` select columns so
#     a member cannot read another trigger's secret.
# ===========================================================================

- table:
    name: users
    schema: public
  array_relationships:
    - name: org_members
      using:
        foreign_key_constraint_on:
          column: user_id
          table:
            name: org_members
            schema: public
  select_permissions:
    - role: user
      permission:
        columns: [id, email, name]
        # See users who share at least one org with the caller.
        filter:
          org_members:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id

- table:
    name: organizations
    schema: public
  array_relationships:
    - name: org_members
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            name: org_members
            schema: public
  select_permissions:
    - role: user
      permission:
        columns: [id, name, quota_allowed, quota_used, period]
        filter:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id

- table:
    name: org_members
    schema: public
  object_relationships:
    - name: user
      using:
        foreign_key_constraint_on: user_id
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  select_permissions:
    - role: user
      permission:
        columns: [user_id, org_id, role]
        filter:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id

- table:
    name: workflows
    schema: public
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  array_relationships:
    - name: steps
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            name: workflow_steps
            schema: public
    - name: triggers
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            name: workflow_triggers
            schema: public
    - name: runs
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            name: workflow_runs
            schema: public
  select_permissions:
    - role: user
      permission:
        columns: [id, org_id, name, created_by, created_at]
        filter:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id

- table:
    name: workflow_steps
    schema: public
  object_relationships:
    - name: workflow
      using:
        foreign_key_constraint_on: workflow_id
  select_permissions:
    - role: user
      permission:
        columns: [id, workflow_id, step_order, type, name, config]
        filter:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id

- table:
    name: workflow_triggers
    schema: public
  object_relationships:
    - name: workflow
      using:
        foreign_key_constraint_on: workflow_id
  select_permissions:
    - role: user
      permission:
        # token intentionally excluded — it is a per-trigger secret.
        columns: [id, workflow_id, type, config]
        filter:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id

- table:
    name: workflow_runs
    schema: public
  object_relationships:
    - name: workflow
      using:
        foreign_key_constraint_on: workflow_id
  array_relationships:
    - name: step_runs
      using:
        foreign_key_constraint_on:
          column: run_id
          table:
            name: step_runs
            schema: public
  select_permissions:
    - role: user
      permission:
        columns: [id, workflow_id, org_id, status, triggered_by, trigger_type, started_at, finished_at, error]
        # Powers the live run subscription — still strictly org-scoped.
        filter:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id

- table:
    name: step_runs
    schema: public
  object_relationships:
    - name: run
      using:
        foreign_key_constraint_on: run_id
  select_permissions:
    - role: user
      permission:
        columns:
          [
            id,
            run_id,
            step_id,
            step_order,
            type,
            name,
            status,
            input,
            output,
            error,
            attempt,
            approved_by,
            approved_at,
            started_at,
            finished_at,
          ]
        filter:
          run:
            workflow:
              organization:
                org_members:
                  user_id:
                    _eq: X-Hasura-User-Id

- table:
    name: artifacts
    schema: public
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  select_permissions:
    - role: user
      permission:
        columns: [id, org_id, run_id, step_id, value, created_at]
        filter:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
